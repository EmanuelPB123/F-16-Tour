<html>

<head>
  <title>F-16 Tour</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/linterna.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="movement-controls"></div>

  <!-- Audio elements for collision sounds -->
  <audio id="collision-sound-1" src="https://cdn.freesound.org/previews/417/417089_5121236-lq.mp3"></audio>
  <audio id="collision-sound-2" src="https://cdn.freesound.org/previews/448/448084_6142149-lq.mp3"></audio>
  <audio id="collision-sound-3" src="https://cdn.freesound.org/previews/411/411642_5121236-lq.mp3"></audio>

  <a-scene>
    <a-sky color="#000000"></a-sky>
    <a-plane position="0 -1 0" rotation="-90 0 0" width="12.5" height="12.5"
      material="color: #7BC8A4; roughness: 0.8; metalness: 0.2;"></a-plane>

    <!-- F-16 model scaled to 1/40 -->
    <a-entity position="-0 0 -2.5" scale="0.05 0.05 0.05" gltf-model="f-16_fighting_falcon_-_fighter_jet_-_free.glb"
      shadow="true">
    </a-entity>

    <!-- Text scaled to 1/40 -->
    <a-text value="F-16 Block 15" position="-0.1 0.375 -0.5" color="#ffffff" scale="0.4 0.4 0.4"></a-text>

    <!-- Camera and flashlight scaled to 1/40 -->
    <a-entity position="0 0.04 0">
      <a-camera look-controls>
        <!-- Flashlight scaled to 1/40 -->
        <a-entity id="flashlight" light="type: spot; 
            color: #fff; 
            intensity: 0.3; 
            angle: 65; 
            penumbra: 0.15; 
            decay: 0.075;
            castShadow: true;
            shadowMapWidth: 1024;
            shadowMapHeight: 1024" position="0 0 0" rotation="0 0 0">
        </a-entity>

        <!-- Flashlight visual model scaled to 1/40 -->
        <a-entity position="0.005 -0.0075 -0.005" rotation="0 -20 0">
          <a-cylinder color="#333" height="0.0025" radius="0.0005" position="0 0 0"></a-cylinder>
          <a-cylinder color="#555" height="0.0005" radius="0.00075" position="0 -0.0015 0"></a-cylinder>
        </a-entity>
      </a-camera>
    </a-entity>
  </a-scene>
</body>

</html>
